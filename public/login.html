<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to TaskFlow to manage, organize, and track your daily tasks and productivity.">
  <title>Sign In — TaskFlow</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <!-- Background Glow Accents -->
  <div class="auth-bg-blob blob-1"></div>
  <div class="auth-bg-blob blob-2"></div>

  <!-- Auth Top Nav -->
  <header class="auth-nav">
    <a href="/" class="auth-logo">
      <div class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
      </div>
      <span class="auth-logo-text">TaskFlow</span>
    </a>

    <div class="auth-nav-actions">
      <!-- Theme Toggle -->
      <button id="themeToggleBtn" class="theme-btn" aria-label="Toggle Theme" title="Toggle Theme">
        <span class="theme-icon light-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.07" x2="5.64" y2="17.64"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </span>
        <span class="theme-icon dark-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
      </button>

      <a href="/" class="btn btn-secondary btn-sm">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back to App</span>
      </a>
    </div>
  </header>

  <!-- Main Auth Card Container -->
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-badge">Welcome back</div>
        <h2>Sign In to TaskFlow</h2>
        <p>Access your tasks, dashboard analytics, and productivity workflow.</p>
      </div>

      <!-- Feedback Alert Box -->
      <div id="authAlert" class="auth-alert hidden" role="alert"></div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form" novalidate>
        <!-- Email Input -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-icon-wrap">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-control with-icon" 
              placeholder="you@example.com" 
              required
              autocomplete="email"
            />
          </div>
          <span class="input-error" id="emailError"></span>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <div class="label-row">
            <label for="password" class="form-label">Password</label>
            <a href="javascript:void(0)" id="btnForgotPwd" class="helper-link">Forgot password?</a>
          </div>
          <div class="input-icon-wrap">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control with-icon with-eye" 
              placeholder="••••••••" 
              required
              autocomplete="current-password"
            />
            <button type="button" class="btn-toggle-pwd" id="togglePwdBtn" aria-label="Toggle password visibility">
              <svg class="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-hide hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <span class="input-error" id="passwordError"></span>
        </div>

        <!-- Options Row -->
        <div class="auth-options-row">
          <label class="custom-checkbox-wrap">
            <input type="checkbox" id="rememberMe" checked />
            <span class="checkbox-label">Remember me for 30 days</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btnSubmitAuth" class="btn btn-primary btn-block">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner hidden">
            <svg class="spinner-svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="32" stroke-dashoffset="12"></circle>
            </svg>
          </span>
        </button>

        <!-- Demo Sign In Option -->
        <div class="auth-divider">
          <span>or for quick testing</span>
        </div>

        <button type="button" id="btnDemoLogin" class="btn btn-secondary btn-block btn-demo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          <span>Instant Demo Sign In</span>
        </button>
      </form>

      <!-- Footer switch link -->
      <div class="auth-footer">
        <p>Don't have an account? <a href="/signup" class="auth-link">Sign Up</a></p>
      </div>
    </div>
  </main>

  <!-- Supabase JS (required for direct browser auth) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <!-- Script -->
  <script src="auth.js"></script>
</body>
</html>
